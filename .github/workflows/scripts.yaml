name: Script Linting
run-name: Script Linting run by @${{ github.actor }} on ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/scripts.yaml"
      - ".shellcheckrc"
      - "**/*.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scripts.yaml"
      - ".shellcheckrc"
      - "**/*.sh"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck --version
          mapfile -d '' files < <(find . -path './.git' -prune -o -type f -name '*.sh' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          shellcheck "${files[@]}"
