name: Documentation Linting
run-name: Documentation Linting run by @${{ github.actor }} on ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - ".markdownlint.json"
      - "**/*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yaml"
      - ".markdownlint.json"
      - "**/*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    name: Lint Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: "**/*.md"
